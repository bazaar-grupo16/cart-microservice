# ──────────────────────────────────────────────────────────────
# Kubernetes Deployment — Bazaar MongoDB Database
# ──────────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cart-db
  labels:
    app: cart-db
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cart-db
  template:
    metadata:
      labels:
        app: cart-db
    spec:
      containers:
        - name: cart-db
          image: mongo:8
          ports:
            - containerPort: 27017
          env:
            - name: MONGO_INITDB_DATABASE
              value: cart_db
          # ── Probes ─────────────────────────────────
          livenessProbe:
            exec:
              command:
                - mongosh
                - --eval
                - "db.adminCommand('ping').ok"
                - --quiet
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            exec:
              command:
                - mongosh
                - --eval
                - "db.adminCommand('ping').ok"
                - --quiet
            initialDelaySeconds: 5
            periodSeconds: 10
          # ── Resources ──────────────────────────────
          resources:
            limits:
              cpu: 500m
              memory: 512Mi
          # ── Persistent Storage ──────────────────────
          volumeMounts:
            - name: mongo-data
              mountPath: /data/db
      volumes:
        - name: mongo-data
          persistentVolumeClaim:
            claimName: cart-db-pvc
