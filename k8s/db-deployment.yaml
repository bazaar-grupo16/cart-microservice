# ──────────────────────────────────────────────────────────────
# Kubernetes Deployment — Bazaar MongoDB Database
# ──────────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cart-db
  labels:
    app: cart-db
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cart-db
  strategy:
    type: Recreate # There cannot be two MongoDB nodes running at the same time because only one can be attached to the same PVC
  template:
    metadata:
      labels:
        app: cart-db
  
    spec:
      containers:
        - name: cart-db
          image: mongo:8
          ports:
            - containerPort: 27017
          env:
            - name: MONGO_INITDB_DATABASE
              value: cart_db
          args:
            - "--wiredTigerCacheSizeGB=0.25"
            - "--wiredTigerEngineConfigString=eviction=(threads_min=1,threads_max=2)"
            - "--maxConns=50"
            - "--setParameter"
            - "diagnosticDataCollectionEnabled=false"
          # ── Probes ─────────────────────────────────
          livenessProbe:
            exec:
              command:
                - mongosh
                - --eval
                - "db.adminCommand('ping').ok"
                - --quiet
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 30
            failureThreshold: 5
          readinessProbe:
            exec:
              command:
                - mongosh
                - --eval
                - "db.adminCommand('ping').ok"
                - --quiet
            initialDelaySeconds: 60
            periodSeconds: 15
            timeoutSeconds: 10
            failureThreshold: 5
          # ── Resources ──────────────────────────────
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 500m
              memory: 512Mi
          # ── Persistent Storage ──────────────────────
          volumeMounts:
            - name: mongo-data
              mountPath: /data/db
      volumes:
        - name: mongo-data
          persistentVolumeClaim:
            claimName: cart-db-pvc
      