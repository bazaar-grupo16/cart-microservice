# ──────────────────────────────────────────────────────────────
# Kubernetes Deployment — Bazaar Cart Microservice
# ──────────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cart-service
  labels:
    app: cart-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cart-service
  template:
    metadata:
      labels:
        app: cart-service
    spec:
      imagePullSecrets:
        - name: ghcr-login-secret
      containers:
        - name: cart-service
          image: $IMAGE_NAME:$IMAGE_TAG
          ports:
            - containerPort: 8080
          # ── Environment from Kubernetes Secret ──────
          env:
            - name: MONGO_URI
              valueFrom:
                secretKeyRef:
                  name: cart-mongo-credentials
                  key: MONGO_URI
            - name: CATALOG_SERVICE_URL
              valueFrom:
                secretKeyRef:
                  name: cart-mongo-credentials
                  key: CATALOG_SERVICE_URL
            - name: PORT
              value: "8080"
            - name: MONGO_COLLECTION
              valueFrom: 
                secretKeyRef:
                  name: cart-mongo-credentials
                  key: MONGO_COLLECTION
            - name: MONGO_DB_NAME
              valueFrom: 
                secretKeyRef:
                  name: cart-mongo-credentials
                  key: MONGO_DB_NAME
            - name: ENVIRONMENT
              valueFrom: 
                secretKeyRef:
                  name: cart-mongo-credentials
                  key: ENVIRONMENT
          # ── Probes ─────────────────────────────────
          livenessProbe:
            httpGet:
              path: /livez
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 15
          # ── Resources ──────────────────────────────
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 256Mi
