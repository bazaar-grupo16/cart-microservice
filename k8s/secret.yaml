# ──────────────────────────────────────────────────────────────
# Kubernetes Secret — Bazaar MongoDB Connection
# ──────────────────────────────────────────────────────────────
# MONGO_URI is injected at deploy time via GitHub Actions + envsubst.
# Never commit real credentials — use GitHub repository secrets.
apiVersion: v1
kind: Secret
metadata:
  name: cart-mongo-credentials
type: Opaque
stringData:
  MONGO_URI: $MONGO_URI
  CATALOG_SERVICE_URL: $CATALOG_SERVICE_URL
  ENVIRONMENT: $ENVIRONMENT
  MONGO_COLLECTION: $MONGO_COLLECTION
  MONGO_DB_NAME: $MONGO_DB_NAME
  
