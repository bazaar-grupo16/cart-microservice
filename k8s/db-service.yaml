# ──────────────────────────────────────────────────────────────
# Kubernetes Service — Bazaar MongoDB Database
# ──────────────────────────────────────────────────────────────
apiVersion: v1
kind: Service
metadata:
  name: cart-db
  labels:
    app: cart-db
spec:
  type: ClusterIP
  selector:
    app: cart-db
  ports:
    - protocol: TCP
      port: 27017
      targetPort: 27017
