# ──────────────────────────────────────────────────────────────
# CI/CD Pipeline — Bazaar Cart Microservice (Go/Gin + MongoDB)
# ──────────────────────────────────────────────────────────────
name: CI/CD

on:
  push:
    branches: [main, dev]
    paths:
      - "src/**"
      - "Dockerfile"
      - "docker-compose.test.yml"
      - "k8s/**"
      - "go.mod"
      - "go.sum"
  pull_request:
    branches: [main, dev]

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  # ── 1. Security scan (SAST) ────────────────────────────────────
  sast:
    name: Security Scan
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run gosec (SAST)
        uses: securego/gosec@master
        with:
          args: ./src/...

  # ── 2. Test ────────────────────────────────────────────────────
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Run tests via docker compose
        run: |
          docker compose -f docker-compose.test.yml up \
            --build \
            --abort-on-container-exit \
            --exit-code-from test-runner

      - name: Cleanup
        if: always()
        run: docker compose -f docker-compose.test.yml down -v

  # ── 3. Build & Push Docker image ──────────────────────────────
  build:
    name: Build & Push
    needs: [sast, test]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.IMAGE_NAME }}:latest

  # ── 4. Deploy to Kubernetes ────────────────────────────────────
  deploy:
    name: Deploy to K8s
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4

      - name: Install doctl
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

      - name: Configure kubectl
        run: doctl kubernetes cluster kubeconfig save e6683ee9-809c-4ab1-a965-bc55aba1ec4a

      - name: Update Kubernetes manifests and deploy
        env:
          IMAGE_TAG: ${{ github.sha }}
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
          MONGO_URI: ${{ secrets.MONGO_URI }}
          CATALOG_SERVICE_URL: ${{ secrets.CATALOG_SERVICE_URL }}
        run: |
          sudo apt-get install -y gettext-base
          for f in k8s/*.yaml; do
            envsubst '${IMAGE_NAME} ${IMAGE_TAG} ${MONGO_URI} ${CATALOG_SERVICE_URL} ${ENVIRONMENT} ${MONGO_COLLECTION} ${MONGO_DB_NAME}' \
              < "$f" | kubectl apply -f - -n bazaar-dev
          done