services:
  mongo-test:
    image: mongo:8
    container_name: mongo_test
    environment:
      MONGO_INITDB_DATABASE: cart_test
    healthcheck:
      test: [ "CMD", "mongosh", "--eval", "db.adminCommand('ping').ok", "--quiet" ]
      interval: 5s
      timeout: 5s
      retries: 10

  test-runner:
    image: golang:alpine
    container_name: backend_test
    working_dir: /app
    volumes:
      - .:/app
    environment:
      - MONGO_URI=mongodb://mongo-test:27017
      - MONGO_DB_NAME=cart_test
      - MONGO_COLLECTION=carts
      - OTEL_SERVICE_NAME=cart
      - OTEL_EXPORTER_OTLP_ENDPOINT=otel-collector:4317
      - OTEL_EXPORTER_OTLP_PROTOCOL=grpc
      - OTEL_RESOURCE_ATTRIBUTES=deployment.environment=test,k8s.cluster.name=bazaar-dev
      - OTEL_PROPAGATORS=tracecontext,baggage
      - OTEL_TRACES_SAMPLER=always_on
      - OTEL_DEPLOYMENT_ENVIRONMENT=test
    depends_on:
      mongo-test:
        condition: service_healthy
    # -count=1 disables test result caching so tests always run against the live DB.
    command: go test ./src/... -v -count=1
